name: go/observability
version: 0.0.2
description: "Reviews Go logs, traces, metrics, context propagation, and telemetry lifecycle defects."

triggers:
  manual: true
  files_changed:
    - "**/*.go"

detection:
  files:
    - "**/*.go"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write: []
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
